<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel skull on the game's background ink, drawn on a 16x16 grid so it
       stays legible at 16px and matches the in-game bone palette. -->
  <rect width="16" height="16" rx="3" fill="#0b0a12" />
  <g fill="#e8e4d8">
    <rect x="4" y="2" width="8" height="1" />
    <rect x="3" y="3" width="10" height="1" />
    <rect x="2" y="4" width="12" height="2" />
    <rect x="2" y="6" width="2" height="2" />
    <rect x="6" y="6" width="4" height="2" />
    <rect x="12" y="6" width="2" height="2" />
    <rect x="2" y="8" width="12" height="1" />
    <rect x="2" y="9" width="5" height="1" />
    <rect x="9" y="9" width="5" height="1" />
    <rect x="3" y="10" width="10" height="1" />
    <rect x="4" y="11" width="8" height="1" />
    <rect x="4" y="12" width="2" height="1" />
    <rect x="7" y="12" width="2" height="1" />
    <rect x="10" y="12" width="2" height="1" />
    <rect x="5" y="13" width="6" height="1" />
  </g>
</svg>
